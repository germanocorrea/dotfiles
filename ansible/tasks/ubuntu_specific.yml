---
# Equivalente (apt) do grupo [arch-base] + dependências de build para Ubuntu.
# Não inclui apps pessoais/GUI nem nada relacionado a AUR (ver arch_specific.yml).
# Nota: requer o componente "universe" habilitado (padrão nas instalações normais).

- name: Instalar Pacotes [ubuntu-base]
  become: yes
  apt:
    name:
      - buildah
      - podman
      - podman-compose
      - distrobox
      - bat
      - fzf
      - ripgrep
      - fd-find
      - jq
      - wl-clipboard
      - golang-go
      - default-jdk
    state: present
  tags:
    - packages
    - ubuntu-base

- name: Instalar Dependências de Compilação (ghcup/rust/tree-sitter)
  become: yes
  apt:
    name:
      - build-essential
      - pkg-config
      - libgmp-dev
      - libnuma-dev
      - zlib1g-dev
    state: present
  tags:
    - packages
    - ubuntu-base

- name: Instalar eza (repositório oficial)
  tags:
    - packages
    - ubuntu-base
  block:
    - name: Criar diretório de keyrings do apt
      become: yes
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar chave GPG do eza
      become: yes
      ansible.builtin.shell:
        cmd: "wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg"
        creates: "/etc/apt/keyrings/gierens.gpg"

    - name: Adicionar repositório do eza
      become: yes
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] https://dl.gierens.de eza main"
        filename: gierens-eza
        state: present

    - name: Instalar eza
      become: yes
      apt:
        name: eza
        state: present
        update_cache: yes
