---
# Equivalente (apt) do grupo [arch-base] + dependências de build para Ubuntu.
# Não inclui apps pessoais/GUI nem nada relacionado a AUR (ver arch_specific.yml).
# Nota: requer o componente "universe" habilitado (padrão nas instalações normais).

- name: Instalar Pacotes [ubuntu-base]
  become: yes
  apt:
    name:
      - buildah
      - podman
      - podman-compose
      - distrobox
      - bat
      - fzf
      - ripgrep
      - fd-find
      - jq
      - wl-clipboard
      - golang-go
      - default-jdk
    state: present
  tags:
    - packages
    - ubuntu-base

- name: Instalar Dependências de Compilação (ghcup/rust/tree-sitter)
  become: yes
  apt:
    name:
      - build-essential
      - pkg-config
      - libgmp-dev
      - libnuma-dev
      - zlib1g-dev
    state: present
  tags:
    - packages
    - ubuntu-base
